name: Build Luxul XBR-4400 Firmware

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools python3

      - name: Verify Kernel Header File
        run: |
          if [ ! -f "kernel_header.bin" ]; then
            echo "[-] Error: kernel_header.bin missing from repository root!"
            exit 1
          fi

      - name: Clean Temporary RootFS Files
        run: |
          # Purge non-persistent runtime files inside squashfs-root
          rm -rf squashfs-root/tmp/*
          rm -rf squashfs-root/var/log/*
          rm -rf squashfs-root/var/run/*

      - name: Fix SSH Permissions
        run: |
          chmod 700 squashfs-root/root/.ssh || true
          chmod 600 squashfs-root/root/.ssh/authorized_keys || true

      - name: Bake Git Commit ID
        run: |
          git rev-parse --short HEAD > squashfs-root/etc/luxul_commit
          echo "Baked commit: $(cat squashfs-root/etc/luxul_commit)"

      - name: Build SquashFS RootFS
        run: |
          mksquashfs squashfs-root custom_rootfs.squashfs \
            -comp xz \
            -b 262144 \
            -noappend \
            -all-root \
            -e .git .github *.bin *.lxl magic.py custom_rootfs.squashfs

      - name: Combine Kernel Header and RootFS
        run: |
          cat kernel_header.bin custom_rootfs.squashfs > custom_XBR-4400.bin

      - name: Patch Headers and Checksums
        run: |
          python3 magic.py
          mv custom_XBR-4400.bin custom_XBR-4400.lxl

      - name: Check Output Firmware Size
        run: |
          SIZE=$(stat -c%s "custom_XBR-4400.lxl")
          echo "Generated Firmware Size: $SIZE bytes"
          if [ $SIZE -gt 10000000 ]; then
            echo "[-] Warning: Firmware size exceeds 10MB! Upload may fail on Web UI."
          fi

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: custom_XBR-4400.lxl
          path: custom_XBR-4400.lxl
          retention-days: 30
